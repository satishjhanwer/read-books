name: Setup Node and Yarn
description: Installs Node from .nvmrc, Yarn 4 via Corepack, and dependencies (with Yarn cache).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    # Node 25+ no longer bundles Corepack, so install it before enabling Yarn from package.json's packageManager.
    - shell: bash
      run: npm install --global corepack@latest && corepack enable
    # Second call only to enable the Yarn cache, which needs `yarn` on PATH.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn
    - shell: bash
      run: yarn install --immutable
